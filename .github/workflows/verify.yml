name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: C# regression checks
        shell: pwsh
        run: |
          foreach ($project in 'VerifyRuntime', 'VerifyAssistant', 'VerifyLogic', 'VerifyStats', 'VerifyEndToEnd', 'VerifyAnalysis') {
            dotnet run --project "verify/$project.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Browser acceptance checks
        run: node verify/web-accept.mjs
