<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>手机点歌台</title>
<link rel="stylesheet" href="/scan/scan.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="mobile-header"><a class="back" href="/">← 点歌台</a><span class="mobile-brand">MaiPlanner<span></span></span></div>
<div class="mobile-intro"><p>YOUR NEXT TRACK</p><h1>下一首，想打什么？</h1><span>找到曲目，轻点难度就能发送到机台。</span></div>
<header class="top">
  <div class="toprow">
    <span class="state-caption">机台状态</span>
    <span id="state" class="state" role="status">连接中…</span>
  </div>
  <div class="searchwrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="q" class="search" type="search" placeholder="搜曲名 / 作曲 / 谱师 / 别名"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           enterkeyhint="search" aria-label="搜索曲目">
    <button id="q-clear" class="qclear" type="button" hidden aria-label="清空搜索">×</button>
  </div>
  <div class="filterrow">
    <label class="sortwrap">排序
      <select id="sort" aria-label="排序">
        <option value="dataid-desc">乐曲id ↓</option>
        <option value="level-desc">定数 ↓</option>
        <option value="level-asc">定数 ↑</option>
        <option value="title">曲名</option>
      </select>
    </label>
    <span id="count" class="count">加载曲库…</span>
  </div>
</header>

<main>
  <div id="list" class="list"></div>
  <div id="more" class="more"></div>
</main>

<script type="module" src="/scan/scan.js"></script>
</body>
</html>
